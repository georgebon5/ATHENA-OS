[project]
name = "athena-gateway"
version = "0.1.0"
description = "ATHENA OS gateway: REST, WebSocket hub, αποθήκευση, ΟΑΣΑ, director"
requires-python = ">=3.11"
dependencies = [
  "athena-contracts",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
athena-contracts = { path = "../../packages/contracts/generated/py", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]  # το μήκος γραμμής το κρατά ο formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
