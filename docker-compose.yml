version: "3.9"

# ATHENA-OS docker-compose
# Owners:
#   services/sim      → Dev 2 (Σωτήρης)
#   services/gateway  → Dev 4 (Φρατζιάς)
#   services/agent    → Dev 3 (Ledi)
#   infra/            → Dev 4 (Φρατζιάς)

services:
  # ── Simulation service (Dev 2) ───────────────────────────────────────────
  sim:
    build:
      context: ./services/sim
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./data:/data:ro
      - ./demo/cache:/demo/cache
    environment:
      MOCK: "${MOCK:-1}"
      DATA_PROCESSED_DIR: /data/processed
      DEMO_CACHE_DIR: /demo/cache
      PORT: "8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

