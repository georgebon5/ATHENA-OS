[project]
name = "athena-contracts"
version = "0.1.0"
description = "Pydantic models του ATHENA OS, παραγόμενα από packages/contracts/schemas"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena_contracts"]
